<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#07080b; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0c12" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e27"/>
      <stop offset="100%" stop-color="#ff5e62"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="960" height="540" fill="#07080b"/>
  <rect width="960" height="540" fill="url(#gridPattern)"/>

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="920" height="500" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Technical Corner Marks -->
  <path d="M 28 40 L 40 40 L 40 28" fill="none" stroke="#ff1e27" stroke-width="2"/>
  <path d="M 932 40 L 920 40 L 920 28" fill="none" stroke="#ff1e27" stroke-width="2"/>
  <path d="M 28 500 L 40 500 L 40 512" fill="none" stroke="#ff1e27" stroke-width="2"/>
  <path d="M 932 500 L 920 500 L 920 512" fill="none" stroke="#ff1e27" stroke-width="2"/>

  <!-- Header Section -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" fill="#ff1e27" font-size="11" font-weight="800" letter-spacing="0.25em" font-family="'Space Mono', monospace">NARRATIVE SCROLL RAIL // 0.00 – 1.00</text>
    <text x="0" y="30" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="0.08em">Chapter 02: Sculptural Shoulder Sweep</text>
    <text x="0" y="52" fill="#8892b0" font-size="13" font-weight="500" letter-spacing="0.05em">Scroll Interval: 0.15 – 0.35 | Coke-Bottle Waistline Dynamics</text>
  </g>

  <!-- Visual Content Zone -->
  <g transform="translate(50, 140)">
    
    <!-- Chapter Narrative Timeline Scrubber -->
    <g transform="translate(60, 40)">
      <!-- Master Timeline Rail -->
      <line x1="0" y1="60" x2="720" y2="60" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="60" x2="240" y2="60" stroke="#ff1e27" stroke-width="4" stroke-linecap="round"/>

      <!-- Chapter Node Markers -->
      
        <circle cx="80" cy="60" r="7" fill="#ff1e27" stroke="#ffffff" stroke-width="2"/>
        <text x="80" y="95" text-anchor="middle" fill="#555d77" font-size="10" font-family="'Space Mono', monospace" font-weight="400">CH.01</text>
      
        <circle cx="200" cy="60" r="12" fill="#ff1e27" stroke="#ffffff" stroke-width="2"/>
        <text x="200" y="95" text-anchor="middle" fill="#ffffff" font-size="10" font-family="'Space Mono', monospace" font-weight="700">CH.02</text>
      
        <circle cx="320" cy="60" r="7" fill="#141722" stroke="#ffffff" stroke-width="2"/>
        <text x="320" y="95" text-anchor="middle" fill="#555d77" font-size="10" font-family="'Space Mono', monospace" font-weight="400">CH.03</text>
      
        <circle cx="440" cy="60" r="7" fill="#141722" stroke="#ffffff" stroke-width="2"/>
        <text x="440" y="95" text-anchor="middle" fill="#555d77" font-size="10" font-family="'Space Mono', monospace" font-weight="400">CH.04</text>
      
        <circle cx="560" cy="60" r="7" fill="#141722" stroke="#ffffff" stroke-width="2"/>
        <text x="560" y="95" text-anchor="middle" fill="#555d77" font-size="10" font-family="'Space Mono', monospace" font-weight="400">CH.05</text>
      
        <circle cx="680" cy="60" r="7" fill="#141722" stroke="#ffffff" stroke-width="2"/>
        <text x="680" y="95" text-anchor="middle" fill="#555d77" font-size="10" font-family="'Space Mono', monospace" font-weight="400">CH.06</text>
      
    </g>

    <!-- Chapter Telemetry & Spline Data -->
    <g transform="translate(60, 160)">
      <rect x="0" y="0" width="720" height="120" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <g transform="translate(24, 28)">
        <text x="0" y="0" fill="#555d77" font-size="10" font-family="'Space Mono', monospace">CAMERA COORDINATE TARGET</text>
        <text x="0" y="24" fill="#ffffff" font-size="14" font-weight="700">Passenger Shoulder [ 3.85, 0.85, 3.2 ]</text>
      </g>
      <g transform="translate(420, 28)">
        <text x="0" y="0" fill="#555d77" font-size="10" font-family="'Space Mono', monospace">PHYSICAL SCROLL INERTIA</text>
        <text x="0" y="24" fill="#00e5ff" font-size="14" font-weight="700">Damped Exponential Lerp (λ = 5.5)</text>
      </g>
    </g>
  
  </g>

  <!-- Footer Telemetry -->
  <g transform="translate(50, 498)">
    <line x1="0" y1="0" x2="860" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="0" y="20" fill="#555d77" font-size="10" font-family="'Space Mono', monospace" letter-spacing="0.15em">CHEVROLET CORVETTE C7 // MOTION IN BLACK // SPEC 650 HP // STINGRAY Z06</text>
    <text x="860" y="20" text-anchor="end" fill="#555d77" font-size="10" font-family="'Space Mono', monospace" letter-spacing="0.15em">THREE.JS r186 // REACT 19</text>
  </g>
</svg>