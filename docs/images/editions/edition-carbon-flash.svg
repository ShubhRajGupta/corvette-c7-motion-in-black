<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#07080b; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0c12" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e27"/>
      <stop offset="100%" stop-color="#ff5e62"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="960" height="540" fill="#07080b"/>
  <rect width="960" height="540" fill="url(#gridPattern)"/>

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="920" height="500" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Technical Corner Marks -->
  <path d="M 28 40 L 40 40 L 40 28" fill="none" stroke="#ff1e27" stroke-width="2"/>
  <path d="M 932 40 L 920 40 L 920 28" fill="none" stroke="#ff1e27" stroke-width="2"/>
  <path d="M 28 500 L 40 500 L 40 512" fill="none" stroke="#ff1e27" stroke-width="2"/>
  <path d="M 932 500 L 920 500 L 920 512" fill="none" stroke="#ff1e27" stroke-width="2"/>

  <!-- Header Section -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" fill="#ff1e27" font-size="11" font-weight="800" letter-spacing="0.25em" font-family="'Space Mono', monospace">CURATED FACTORY EDITIONS // PBR CLEARCOAT</text>
    <text x="0" y="30" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="0.08em">Edition 01: Carbon Flash Metallic</text>
    <text x="0" y="52" fill="#8892b0" font-size="13" font-weight="500" letter-spacing="0.05em">Deep Obsidian with micro-metallic gold/violet pearl | Clearcoat: 1.0 | Roughness: 0.18</text>
  </g>

  <!-- Visual Content Zone -->
  <g transform="translate(50, 140)">
    
    <!-- Paint Sample Spherical Shader Swatch -->
    <g transform="translate(60, 20)">
      <circle cx="160" cy="140" r="110" fill="#101114" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <!-- Radial Highlight Reflection -->
      <ellipse cx="120" cy="90" rx="60" ry="35" fill="#3b3d45" fill-opacity="0.45" transform="rotate(-20 120 90)"/>
      <circle cx="105" cy="75" r="14" fill="#ffffff" fill-opacity="0.75"/>
      <!-- Ambient Floor Bounce Rim -->
      <path d="M 70 190 C 110 240, 210 240, 250 190" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
    </g>

    <!-- Material Science Matrix -->
    <g transform="translate(420, 20)">
      <rect x="0" y="0" width="420" height="280" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="24" y="32" fill="#ffffff" font-size="14" font-weight="700">PBR MATERIAL SPECIFICATION</text>
      <text x="24" y="52" fill="#8892b0" font-size="10" font-family="'Space Mono', monospace">THREE.MeshPhysicalMaterial PIPELINE</text>

      <line x1="24" y1="68" x2="396" y2="68" stroke="rgba(255,255,255,0.08)"/>

      <g transform="translate(24, 90)">
        <text x="0" y="0" fill="#555d77" font-size="10" font-family="'Space Mono', monospace">BASE ALBEDO COLOR</text>
        <rect x="0" y="8" width="18" height="18" rx="3" fill="#101114" stroke="rgba(255,255,255,0.3)"/>
        <text x="26" y="22" fill="#ffffff" font-size="12" font-family="'Space Mono', monospace">#101114</text>
      </g>

      <g transform="translate(24, 150)">
        <text x="0" y="0" fill="#555d77" font-size="10" font-family="'Space Mono', monospace">CLEARCOAT PROPERTIES</text>
        <text x="0" y="20" fill="#ffffff" font-size="12" font-weight="600">Clearcoat: 1.0 | Roughness: 0.04 | IOR: 1.52</text>
      </g>

      <g transform="translate(24, 210)">
        <text x="0" y="0" fill="#555d77" font-size="10" font-family="'Space Mono', monospace">FINISH CLASSIFICATION</text>
        <text x="0" y="20" fill="#ff1e27" font-size="12" font-weight="700">Carbon Flash Metallic</text>
      </g>
    </g>
  
  </g>

  <!-- Footer Telemetry -->
  <g transform="translate(50, 498)">
    <line x1="0" y1="0" x2="860" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="0" y="20" fill="#555d77" font-size="10" font-family="'Space Mono', monospace" letter-spacing="0.15em">CHEVROLET CORVETTE C7 // MOTION IN BLACK // SPEC 650 HP // STINGRAY Z06</text>
    <text x="860" y="20" text-anchor="end" fill="#555d77" font-size="10" font-family="'Space Mono', monospace" letter-spacing="0.15em">THREE.JS r186 // REACT 19</text>
  </g>
</svg>