<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#07080b; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0c12" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e27"/>
      <stop offset="100%" stop-color="#ff5e62"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="960" height="540" fill="#07080b"/>
  <rect width="960" height="540" fill="url(#gridPattern)"/>

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="920" height="500" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Technical Corner Marks -->
  <path d="M 28 40 L 40 40 L 40 28" fill="none" stroke="#ff1e27" stroke-width="2"/>
  <path d="M 932 40 L 920 40 L 920 28" fill="none" stroke="#ff1e27" stroke-width="2"/>
  <path d="M 28 500 L 40 500 L 40 512" fill="none" stroke="#ff1e27" stroke-width="2"/>
  <path d="M 932 500 L 920 500 L 920 512" fill="none" stroke="#ff1e27" stroke-width="2"/>

  <!-- Header Section -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" fill="#ff1e27" font-size="11" font-weight="800" letter-spacing="0.25em" font-family="'Space Mono', monospace">CINEMATIC PRELOADER & LOADING-TIME MANAGEMENT</text>
    <text x="0" y="30" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="0.08em">Pre-React Zero-Latency Boot Shell</text>
    <text x="0" y="52" fill="#8892b0" font-size="13" font-weight="500" letter-spacing="0.05em">Raw inline HTML/CSS with SVG Stingray silhouette rendering at Byte 0</text>
  </g>

  <!-- Visual Content Zone -->
  <g transform="translate(50, 140)">
    
    <!-- Preloader Assembly Step Diagram -->
    <g transform="translate(60, 30)">
      
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="80" height="90" rx="4" fill="#141722" stroke="#ff1e27" stroke-width="1.5"/>
          <text x="40" y="32" text-anchor="middle" fill="#ff1e27" font-size="9" font-family="'Space Mono', monospace">PHASE 01</text>
          <text x="40" y="55" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">1. INIT</text>
          <circle cx="40" cy="72" r="4" fill="#ff1e27"/>
        </g>
      
        <g transform="translate(90, 0)">
          <rect x="0" y="0" width="80" height="90" rx="4" fill="#141722" stroke="#ff1e27" stroke-width="1.5"/>
          <text x="40" y="32" text-anchor="middle" fill="#ff1e27" font-size="9" font-family="'Space Mono', monospace">PHASE 02</text>
          <text x="40" y="55" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">2. ASSETS</text>
          <circle cx="40" cy="72" r="4" fill="#ff1e27"/>
        </g>
      
        <g transform="translate(180, 0)">
          <rect x="0" y="0" width="80" height="90" rx="4" fill="#141722" stroke="#ff1e27" stroke-width="1.5"/>
          <text x="40" y="32" text-anchor="middle" fill="#ff1e27" font-size="9" font-family="'Space Mono', monospace">PHASE 03</text>
          <text x="40" y="55" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">3. GEOMETRY</text>
          <circle cx="40" cy="72" r="4" fill="#ff1e27"/>
        </g>
      
        <g transform="translate(270, 0)">
          <rect x="0" y="0" width="80" height="90" rx="4" fill="#141722" stroke="#ff1e27" stroke-width="1.5"/>
          <text x="40" y="32" text-anchor="middle" fill="#ff1e27" font-size="9" font-family="'Space Mono', monospace">PHASE 04</text>
          <text x="40" y="55" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">4. PBR PBR</text>
          <circle cx="40" cy="72" r="4" fill="#ff1e27"/>
        </g>
      
        <g transform="translate(360, 0)">
          <rect x="0" y="0" width="80" height="90" rx="4" fill="#141722" stroke="#ff1e27" stroke-width="1.5"/>
          <text x="40" y="32" text-anchor="middle" fill="#ff1e27" font-size="9" font-family="'Space Mono', monospace">PHASE 05</text>
          <text x="40" y="55" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">5. PREWARM</text>
          <circle cx="40" cy="72" r="4" fill="#ff1e27"/>
        </g>
      
        <g transform="translate(450, 0)">
          <rect x="0" y="0" width="80" height="90" rx="4" fill="#141722" stroke="#ff1e27" stroke-width="1.5"/>
          <text x="40" y="32" text-anchor="middle" fill="#ff1e27" font-size="9" font-family="'Space Mono', monospace">PHASE 06</text>
          <text x="40" y="55" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">6. AUDIO</text>
          <circle cx="40" cy="72" r="4" fill="#ff1e27"/>
        </g>
      
        <g transform="translate(540, 0)">
          <rect x="0" y="0" width="80" height="90" rx="4" fill="#141722" stroke="#ff1e27" stroke-width="1.5"/>
          <text x="40" y="32" text-anchor="middle" fill="#ff1e27" font-size="9" font-family="'Space Mono', monospace">PHASE 07</text>
          <text x="40" y="55" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">7. CALIBRATE</text>
          <circle cx="40" cy="72" r="4" fill="#ff1e27"/>
        </g>
      
        <g transform="translate(630, 0)">
          <rect x="0" y="0" width="80" height="90" rx="4" fill="#141722" stroke="#00e5ff" stroke-width="1.5"/>
          <text x="40" y="32" text-anchor="middle" fill="#ff1e27" font-size="9" font-family="'Space Mono', monospace">PHASE 08</text>
          <text x="40" y="55" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">8. READY</text>
          <circle cx="40" cy="72" r="4" fill="#00e5ff"/>
        </g>
      
    </g>

    <!-- Technical Note Card -->
    <g transform="translate(60, 160)">
      <rect x="0" y="0" width="720" height="110" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <g transform="translate(24, 28)">
        <text x="0" y="0" fill="#555d77" font-size="10" font-family="'Space Mono', monospace">STAGING METHODOLOGY</text>
        <text x="0" y="24" fill="#ffffff" font-size="13" font-weight="600">First Contentful Paint under 350ms even on constrained mobile networks</text>
      </g>
      <g transform="translate(440, 28)">
        <text x="0" y="0" fill="#555d77" font-size="10" font-family="'Space Mono', monospace">PACING CEILING</text>
        <text x="0" y="24" fill="#00e5ff" font-size="13" font-weight="600">Min 1.4s | Safety Cap 12.0s</text>
      </g>
    </g>
  
  </g>

  <!-- Footer Telemetry -->
  <g transform="translate(50, 498)">
    <line x1="0" y1="0" x2="860" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="0" y="20" fill="#555d77" font-size="10" font-family="'Space Mono', monospace" letter-spacing="0.15em">CHEVROLET CORVETTE C7 // MOTION IN BLACK // SPEC 650 HP // STINGRAY Z06</text>
    <text x="860" y="20" text-anchor="end" fill="#555d77" font-size="10" font-family="'Space Mono', monospace" letter-spacing="0.15em">THREE.JS r186 // REACT 19</text>
  </g>
</svg>