<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background:#07080b; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0c12" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e27"/>
      <stop offset="100%" stop-color="#ff5e62"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="960" height="540" fill="#07080b"/>
  <rect width="960" height="540" fill="url(#gridPattern)"/>

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="920" height="500" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Technical Corner Marks -->
  <path d="M 28 40 L 40 40 L 40 28" fill="none" stroke="#ff1e27" stroke-width="2"/>
  <path d="M 932 40 L 920 40 L 920 28" fill="none" stroke="#ff1e27" stroke-width="2"/>
  <path d="M 28 500 L 40 500 L 40 512" fill="none" stroke="#ff1e27" stroke-width="2"/>
  <path d="M 932 500 L 920 500 L 920 512" fill="none" stroke="#ff1e27" stroke-width="2"/>

  <!-- Header Section -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" fill="#ff1e27" font-size="11" font-weight="800" letter-spacing="0.25em" font-family="'Space Mono', monospace">MINIMAL CONTEXTUAL UI // HUD ARCHITECTURE</text>
    <text x="0" y="30" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="0.08em">Factory Curated Color Swatch Palette</text>
    <text x="0" y="52" fill="#8892b0" font-size="13" font-weight="500" letter-spacing="0.05em">5 authentic factory finishes rendered with micro-bead radial reflections</text>
  </g>

  <!-- Visual Content Zone -->
  <g transform="translate(50, 140)">
    
    <!-- UI Visual Wireframe Mock -->
    <g transform="translate(60, 20)">
      <rect x="0" y="0" width="720" height="150" rx="6" fill="#141722" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      <!-- Top Bar Wireframe -->
      <text x="24" y="35" fill="rgba(255,255,255,0.4)" font-size="11" font-weight="900" letter-spacing="0.1em">CORVETTE C7</text>
      <rect x="440" y="20" width="75" height="24" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)"/>
      <text x="477" y="36" text-anchor="middle" fill="#ffffff" font-size="9" font-family="'Space Mono', monospace">AUDIO: ON</text>
      <rect x="525" y="20" width="85" height="24" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)"/>
      <text x="567" y="36" text-anchor="middle" fill="#ffffff" font-size="9" font-family="'Space Mono', monospace">FONT: BARLOW</text>
      <!-- Circular Repo Button -->
      <circle cx="635" cy="32" r="14" fill="rgba(255,255,255,0.08)" stroke="#ff1e27" stroke-width="1.5"/>
      <circle cx="635" cy="32" r="4" fill="#ffffff"/>

      <!-- Center Subtitle -->
      <text x="360" y="105" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="900" letter-spacing="0.15em">MOTION IN BLACK</text>
    </g>

    <!-- Description Card -->
    <g transform="translate(60, 190)">
      <rect x="0" y="0" width="720" height="80" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <g transform="translate(24, 24)">
        <text x="0" y="0" fill="#555d77" font-size="10" font-family="'Space Mono', monospace">DESIGN PRINCIPLE</text>
        <text x="0" y="22" fill="#ffffff" font-size="13" font-weight="600">Contextual right-hand floating dock</text>
      </g>
    </g>
  
  </g>

  <!-- Footer Telemetry -->
  <g transform="translate(50, 498)">
    <line x1="0" y1="0" x2="860" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="0" y="20" fill="#555d77" font-size="10" font-family="'Space Mono', monospace" letter-spacing="0.15em">CHEVROLET CORVETTE C7 // MOTION IN BLACK // SPEC 650 HP // STINGRAY Z06</text>
    <text x="860" y="20" text-anchor="end" fill="#555d77" font-size="10" font-family="'Space Mono', monospace" letter-spacing="0.15em">THREE.JS r186 // REACT 19</text>
  </g>
</svg>